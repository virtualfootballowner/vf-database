# Railway config-as-code. Overrides default `npm ci` when Nixpacks is used instead of Dockerfile.
# Bot service: buildCommand = "npm run ci:install"  (no next build)
# Web service:  buildCommand = "npm run ci:install && npm run build"

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
